name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check chemout scripts tests
      - run: python -m pytest -q
      - run: python scripts/make_goldens.py --check
      - name: CLI smoke
        run: |
          chemout info tests/data/cclib-data/ORCA6.0/1618.out
          chemout parse tests/data/cclib-data/Gaussian16/water_neutral_nbo_opt_freq.out -o out.json
          chemout batch tests/data/cclib-data --csv summary.csv -o all.h5 -q
